databases:
  - name: examgap-db
    plan: free
    databaseName: examgap
    user: examgap

services:
  - type: web
    name: examgap
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: examgap-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
